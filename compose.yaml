services :
  mongodb:
    image: mongo:7
    container_name: factoryflow_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        mongosh --quiet --eval "
        try{
          rs.status().ok
        } catch(e){
          rs.initiate({_id: 'rs0',members : [{_id: 0, host: 'mongodb:27017'}]
        }).ok
        }"
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: factoryflow_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/factoryflow?replicaSet=rs0
      - JWT_SECRET=dev_secret_key_factoryflow_2026
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  mongo_data:
  